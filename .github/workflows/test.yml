name: Unit Tests

on:
  push:
    paths:
      - '**'
      - '**/*.py'
      - '.github/workflows/*'
  pull_request:
    paths:
      - '**'
      - '**/*.py'
      - '.github/workflows/*'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requests
        run: pip install requests
      - name: Run tests
        run: python3 -m unittest discover -s tests -t . -p '*_test.py'
name: Unit Tests

on:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install requests
        run: pip install requests

      - name: Run tests
        run: python3 -m unittest discover -s tests -t . -p '*_test.py'
name: Proton VPN probe

# Probe only: works out which Proton VPN versions the current patch set can
# actually patch, then renders the Patch | Supported Version matrix into the run
# summary so it can be reviewed as rendered markdown before it goes anywhere near
# a release body. Not wired to a release.
#
# One matrix leg per release, so the patching runs in parallel and each leg's
# patcher output is visible in its own log. A sequential walk hid the patcher
# output entirely, which made it impossible to tell a real patch run from a
# cache replay.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  PACKAGE: ch.protonvpn.android
  UPSTREAM: ProtonVPN/android-app
  RUSH_OWNER_REPO: rushiranpise/morphe-patches
  HOODLES_OWNER_REPO: hoo-dles/morphe-patches
  # Kept in step with src/patches/Proton-VPN-*/ in this repo. The first two come from
  # MorpheApp's bundle, the next from rushiranpise's, the last four from hoo-dles's.
  EXPECTED_PATCHES: |
    Change installer source
    Disable Play Store updates
    Unlock VPN Plus
    Unlock custom DNS
    Remove delay
    Unlock LAN connections
    Unlock split tunneling
  # These two live in every bundle's shared set and apply to any app, so a version
  # carrying nothing else is not worth shipping.
  GENERIC_PATCHES: |
    Change installer source
    Disable Play Store updates
  MAX_VERSIONS: '10'

jobs:
  discover:
    name: Resolve toolchain and versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      bundles: ${{ steps.plan.outputs.bundles }}
      toolchain_key: ${{ steps.plan.outputs.toolchain_key }}
      rush_recommended: ${{ steps.plan.outputs.rush_recommended }}
      hoodles_recommended: ${{ steps.plan.outputs.hoodles_recommended }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.13'

      - name: Restore cached toolchain
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: toolchain
          key: pending

      - name: Resolve, download and cache the toolchain
        id: plan
        run: |
          set -euo pipefail
          # Newest release carrying a wanted asset, prereleases preferred. Only the tags
          # are needed to form a cache key, so a hit skips the download entirely.
          newest_tag() {
            gh api "repos/$1/releases?per_page=30" | jq -r '
              ([.[] | select(.draft == false)] | sort_by(.published_at) | reverse) as $all
              | ([$all[] | select(.prerelease == true)] + [$all[] | select(.prerelease == false)])
              | .[0].tag_name'
          }
          newest_asset() {
            gh api "repos/$1/releases?per_page=30" | jq -r --arg ext "$2" '
              ([.[] | select(.draft == false)] | sort_by(.published_at) | reverse) as $all
              | ([$all[] | select(.prerelease == true)] + [$all[] | select(.prerelease == false)])
              | .[].assets[]? | select(.name | endswith($ext)) | .browser_download_url' | head -1
          }

          mpp=$(newest_tag MorpheApp/morphe-patches)
          rush=$(newest_tag "$RUSH_OWNER_REPO")
          hoo=$(newest_tag "$HOODLES_OWNER_REPO")
          jar=$(newest_tag MorpheApp/morphe-desktop)
          for t in "$mpp" "$rush" "$hoo" "$jar"; do
            [[ "$t" != "null" && -n "$t" ]] || { echo "::error::could not resolve a release tag"; exit 1; }
          done
          key="protonvpn-toolchain-${mpp}-${rush}-${hoo}-${jar}"
          {
            echo "toolchain_key=$key"
          } >> "$GITHUB_OUTPUT"
          echo "patches: $mpp $rush $hoo"
          echo "patcher: $jar"

          mkdir -p toolchain
          if [[ ! -s toolchain/morphe-desktop.jar ]]; then
            curl -fsSL -o toolchain/patches-morpheapp.mpp "$(newest_asset MorpheApp/morphe-patches .mpp)"
            curl -fsSL -o toolchain/patches-rushiranpise.mpp "$(newest_asset "$RUSH_OWNER_REPO" .mpp)"
            curl -fsSL -o toolchain/patches-hoodles.mpp "$(newest_asset "$HOODLES_OWNER_REPO" .mpp)"
            curl -fsSL -o toolchain/morphe-desktop.jar "$(newest_asset MorpheApp/morphe-desktop .jar)"
            for f in patches-morpheapp.mpp patches-rushiranpise.mpp patches-hoodles.mpp morphe-desktop.jar; do
              [[ -s "toolchain/$f" ]] || { echo "::error::$f missing or empty"; exit 1; }
            done
          fi
          ls -la toolchain

          # Each source states the app version its patches were written against. Read
          # them rather than hardcoding, since they move with every patch release.
          recommended() {
            java -jar toolchain/morphe-desktop.jar list-versions -f "$PACKAGE" \
              --patches="toolchain/$1" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*([0-9]+(\.[0-9]+)+).*/\1/p' | head -1
          }
          rush_rec=$(recommended patches-rushiranpise.mpp)
          hoo_rec=$(recommended patches-hoodles.mpp)
          echo "rushiranpise recommends: ${rush_rec:-unknown}"
          echo "hoo-dles recommends: ${hoo_rec:-unknown}"
          {
            echo "rush_recommended=$rush_rec"
            echo "hoodles_recommended=$hoo_rec"
          } >> "$GITHUB_OUTPUT"

          # Cover every release from the newest down to the oldest of the two stated
          # versions, so the matrix reaches a version both sources actually claim.
          tags=$(gh api "repos/$UPSTREAM/releases?per_page=40" \
                 | jq -r '[.[] | select(.draft == false) | .tag_name]')
          deepest=""
          for want in "$rush_rec" "$hoo_rec"; do
            [[ -n "$want" ]] || continue
            idx=$(printf '%s\n' "$tags" | grep -n "^${want}$" | head -1 | cut -d: -f1)
            [[ -n "$idx" ]] || { echo "::warning::$want is not a published release tag"; continue; }
            if [[ -z "$deepest" ]] || [[ "$idx" -gt "$deepest" ]]; then
              deepest="$idx"
            fi
          done
          [[ -n "$deepest" ]] || deepest=3
          # A little past the deepest stated version, so a release that both sources
          # already cover is visible next to the ones they do not.
          want_n=$(( deepest + 2 ))
          [[ "$want_n" -gt "$MAX_VERSIONS" ]] && want_n=$MAX_VERSIONS
          echo "covering the newest $want_n release(s) to reach $rush_rec and $hoo_rec"

          matrix=$(printf '%s\n' "$tags" | head -"$want_n" \
                   | jq -R . | jq -sc '{include: map({version: .})}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          # Results stay valid only while the bundles are unchanged, so the fingerprint
          # goes in the result cache key. The patcher is excluded on purpose: a new
          # patcher can change how a patch behaves.
          echo "bundles=$(cat toolchain/patches-*.mpp | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Save the toolchain cache
        uses: actions/cache/save@v4
        with:
          path: toolchain
          key: ${{ steps.plan.outputs.toolchain_key }}

  patch:
    name: Patch ${{ matrix.version }}
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.13'

      - name: Restore cached toolchain
        uses: actions/cache/restore@v4
        with:
          path: toolchain
          key: ${{ needs.discover.outputs.toolchain_key }}

      - name: Confirm the toolchain arrived
        run: |
          set -euo pipefail
          for f in patches-morpheapp.mpp patches-rushiranpise.mpp patches-hoodles.mpp morphe-desktop.jar; do
            [[ -s "toolchain/$f" ]] || { echo "::error::$f missing from the toolchain cache"; exit 1; }
          done

      - name: Resolve the download URL and size
        id: asset
        run: |
          set -euo pipefail
          # Resolved before the cache lookup, because the cache key needs the size.
          read -r url size < <(gh api "repos/$UPSTREAM/releases/tags/${{ matrix.version }}" \
            | jq -r '[.assets[] | select(.name | contains("vanilla-direct"))][0]
                     | "\(.browser_download_url) \(.size)"')
          [[ "$url" == "http"* && "$size" =~ ^[0-9]+$ ]] \
            || { echo "::error::could not resolve the direct-release APK"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.version }} -> $(basename "$url") ($size bytes)"

      - name: Restore cached original
        id: orig
        uses: actions/cache/restore@v4
        with:
          path: original
          # Keyed on the version and the size the upstream API reports, so a corrected
          # or re-uploaded asset never reuses a stale download.
          key: protonvpn-apk-${{ matrix.version }}-${{ steps.asset.outputs.size }}

      - name: Download the original
        if: steps.orig.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p original
          curl -fsSL -o original/app.apk '${{ steps.asset.outputs.url }}'
          got=$(stat -c%s original/app.apk)
          # A truncated download makes the patcher emit an empty result, which looks
          # identical to "this version is not supported" and drops it silently.
          if [[ "$got" != '${{ steps.asset.outputs.size }}' ]]; then
            echo "::error::truncated download: got $got, expected ${{ steps.asset.outputs.size }}"
            exit 1
          fi
          ls -la original

      - name: Save the original
        if: steps.orig.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: original
          key: protonvpn-apk-${{ matrix.version }}-${{ steps.asset.outputs.size }}

      - name: Build the options file
        run: |
          set -euo pipefail
          # Three bundles are required. The generic install-source and update patches
          # live in MorpheApp's, the premium unlock in rushiranpise's and the DNS, LAN,
          # split-tunneling and delay unlocks in hoo-dles's. No single repo has all of
          # them, so one bundle alone cannot satisfy the request.
          java -jar toolchain/morphe-desktop.jar options-create \
            -f "$PACKAGE" -o options.json \
            -p toolchain/patches-morpheapp.mpp \
            -p toolchain/patches-rushiranpise.mpp \
            -p toolchain/patches-hoodles.mpp

          # With more than one bundle loaded the -e flags are ignored and the options
          # file wins, so the selection has to be made here. Enabled by name across
          # every bundle so it does not matter which bundle each patch landed in.
          want=$(printf '%s\n' "$EXPECTED_PATCHES" | jq -R . | jq -sc .)
          jq --argjson want "$want" '
            [.[] | .patches |= with_entries(
               if (.key as $k | $want | index($k)) then .value.enabled = true else . end)]
          ' options.json > options.tmp && mv options.tmp options.json

      - name: Patch
        run: |
          set -euo pipefail
          # --force skips the APK version compatibility check, so every patch is
          # attempted on a release the bundle does not declare. Without it a patch that
          # would work is filtered out silently instead of being applied.
          #
          # --continue-on-error keeps a partial result usable: a patch that cannot match
          # its fingerprint is recorded as failed rather than aborting the build.
          #
          # Output is not captured, so the patcher's own Applied/FAILED lines stay in
          # this leg's log where they can be checked against the reported matrix.
          java -jar toolchain/morphe-desktop.jar patch \
            --patches=toolchain/patches-morpheapp.mpp \
            --patches=toolchain/patches-rushiranpise.mpp \
            --patches=toolchain/patches-hoodles.mpp \
            --options-file=options.json \
            --striplibs=arm64-v8a \
            --out="out-${{ matrix.version }}.apk" \
            -r="result-${{ matrix.version }}.json" \
            --keystore=src/keystore/morphe.keystore \
            --force --continue-on-error \
            original/app.apk

          echo "reported result:"
          jq -r '"  applied: \([.appliedPatches[]?.name] | join(", "))",
                 "  failed:  \([.failedPatches[]?.patch.name] | join(", "))"' \
            "result-${{ matrix.version }}.json"

      - name: Upload the result
        uses: actions/upload-artifact@v7.0.1
        with:
          name: result-${{ matrix.version }}
          path: |
            result-${{ matrix.version }}.json
            out-${{ matrix.version }}.apk
          retention-days: 7
          if-no-files-found: error

  report:
    name: Render the matrix
    needs: [discover, patch]
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RUSH_RECOMMENDED: ${{ needs.discover.outputs.rush_recommended }}
      HOODLES_RECOMMENDED: ${{ needs.discover.outputs.hoodles_recommended }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.13'

      - name: Collect every result
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Combine and render
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/protonvpn-probe/table.py" results

      - name: Show the matrix in the run summary
        run: |
          set -euo pipefail
          # The repo has issues disabled, so the summary is the only place the matrix
          # can be reviewed as rendered markdown without publishing anything.
          {
            echo "## Proton VPN patch matrix"
            echo
            cat probe-body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rendered body
        uses: actions/upload-artifact@v7.0.1
        with:
          name: protonvpn-matrix
          path: probe-body.md
          retention-days: 7
          if-no-files-found: error
name: Proton VPN probe

# Probe only: works out which Proton VPN versions the current patch set can
# actually patch, then renders the Patch | Supported Version matrix into the run
# summary so it can be reviewed as rendered markdown before it goes anywhere near
# a release body. Not wired to a release.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  REPO_FULL: rahaaatul/Morphed
  PACKAGE: ch.protonvpn.android
  UPSTREAM: ProtonVPN/android-app
  # Kept in step with src/patches/Proton-VPN-*/ in this repo. The first two come from
  # MorpheApp's bundle, the next from rushiranpise's, the last four from hoo-dles's.
  EXPECTED_PATCHES: |
    Change installer source
    Disable Play Store updates
    Unlock VPN Plus
    Unlock custom DNS
    Remove delay
    Unlock LAN connections
    Unlock split tunneling
  # These two live in every bundle's shared set and apply to any app, so a version
  # carrying nothing else is not worth shipping.
  GENERIC_PATCHES: |
    Change installer source
    Disable Play Store updates
  # Walking deep is the point: a version further back may be the first where all
  # seven apply. Results are cached per patch bundle set, so re-walking is cheap.
  MAX_VERSIONS: '10'

jobs:
  probe:
    name: Probe patch matrix
    runs-on: ubuntu-24.04
    env:
      # Every GitHub call in this job goes through gh api, which needs a token. Left
      # anonymous, the calls get rate limited and curl exits 22 on a plain HTTP error.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Assert the JDK is new enough
        run: |
          set -euo pipefail
          # The runner image only ships JDK 17, so setup-java is required rather than
          # optional. The action caches gradle and maven repositories but not the JDK
          # distribution itself, so the download it does cannot be cached away. Assert
          # afterwards instead of trusting the requested version resolved as asked.
          v=$(java -version 2>&1 | head -1 | sed -nE 's/.*version "([0-9]+).*/\1/p')
          if [[ -z "$v" ]] || [[ "$v" -lt 21 ]]; then
            echo "::error::needs JDK 21 or newer, found ${v:-none}"
            exit 1
          fi
          java -version

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.13'

      - name: Resolve toolchain versions
        id: toolchain
        run: |
          set -euo pipefail
          # Newest release carrying a wanted asset, prereleases preferred. Only the
          # tags are needed here, and they form the cache key, so a cached toolchain
          # is used without downloading anything first.
          newest_tag() {
            # gh api's own --jq is gojq and takes no --arg, so pipe into jq when the
            # filter needs a parameter.
            gh api "repos/$1/releases?per_page=30" | jq -r '
              ([.[] | select(.draft == false)] | sort_by(.published_at) | reverse) as $all
              | ([$all[] | select(.prerelease == true)] + [$all[] | select(.prerelease == false)])
              | .[0].tag_name'
          }
          mpp=$(newest_tag MorpheApp/morphe-patches)
          rush=$(newest_tag rushiranpise/morphe-patches)
          hoo=$(newest_tag hoo-dles/morphe-patches)
          jar=$(newest_tag MorpheApp/morphe-desktop)
          for t in "$mpp" "$rush" "$hoo" "$jar"; do
            [[ "$t" != "null" && -n "$t" ]] || { echo "::error::could not resolve a release tag"; exit 1; }
          done
          echo "patches: $mpp $rush $hoo"
          echo "patcher: $jar"
          {
            echo "key=protonvpn-toolchain-${mpp}-${rush}-${hoo}-${jar}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cached toolchain
        uses: actions/cache/restore@v4
        with:
          path: toolchain
          key: ${{ steps.toolchain.outputs.key }}

      - name: Download the toolchain if it was not cached
        id: dl
        run: |
          set -euo pipefail
          mkdir -p toolchain
          need=0
          for f in patches-morpheapp.mpp patches-rushiranpise.mpp patches-hoodles.mpp morphe-desktop.jar; do
            [[ -s "toolchain/$f" ]] || need=1
          done
          if [[ $need -eq 0 ]]; then
            echo "toolchain restored from cache"
            ls -la toolchain
            exit 0
          fi

          newest_asset() {
            local repo=$1 ext=$2
            gh api "repos/${repo}/releases?per_page=30" | jq -r --arg ext "$ext" '
              ([.[] | select(.draft == false)] | sort_by(.published_at) | reverse) as $all
              | ([$all[] | select(.prerelease == true)] + [$all[] | select(.prerelease == false)])
              | .[].assets[]? | select(.name | endswith($ext)) | .browser_download_url' \
              | head -1
          }

          curl -fsSL -o toolchain/patches-morpheapp.mpp "$(newest_asset MorpheApp/morphe-patches .mpp)"
          curl -fsSL -o toolchain/patches-rushiranpise.mpp "$(newest_asset rushiranpise/morphe-patches .mpp)"
          curl -fsSL -o toolchain/patches-hoodles.mpp "$(newest_asset hoo-dles/morphe-patches .mpp)"
          curl -fsSL -o toolchain/morphe-desktop.jar "$(newest_asset MorpheApp/morphe-desktop .jar)"

          for f in patches-morpheapp.mpp patches-rushiranpise.mpp patches-hoodles.mpp morphe-desktop.jar; do
            [[ -s "toolchain/$f" ]] || { echo "::error::$f missing or empty"; exit 1; }
          done
          ls -la toolchain
          echo "downloaded=1" >> "$GITHUB_OUTPUT"

      - name: Save the toolchain cache
        if: steps.dl.outputs.downloaded == '1'
        uses: actions/cache/save@v4
        with:
          path: toolchain
          key: ${{ steps.toolchain.outputs.key }}

      - name: Build the combined options file
        id: bundles
        run: |
          set -euo pipefail
          # Three bundles are required. The generic install-source and update patches
          # live in MorpheApp's, the premium unlock in rushiranpise's and the DNS, LAN,
          # split-tunneling and delay unlocks in hoo-dles's. No single repo has all of
          # them, so one bundle alone cannot satisfy the request.
          java -jar toolchain/morphe-desktop.jar options-create \
            -f "$PACKAGE" -o options.json \
            -p toolchain/patches-morpheapp.mpp \
            -p toolchain/patches-rushiranpise.mpp \
            -p toolchain/patches-hoodles.mpp

          # With more than one bundle loaded the -e flags are ignored and the options
          # file wins, so the selection has to be made here. Enabled by name across
          # every bundle so it does not matter which bundle each patch landed in.
          want=$(printf '%s\n' "$EXPECTED_PATCHES" | jq -R . | jq -sc .)
          jq --argjson want "$want" '
            [.[] | .patches |= with_entries(
               if (.key as $k | $want | index($k)) then .value.enabled = true else . end)]
          ' options.json > options.tmp && mv options.tmp options.json

          echo "enabled per bundle:"
          jq -r 'to_entries[]
                 | "  bundle \(.key): \(.value.patches | to_entries
                     | map(select(.value.enabled) | .key) | join(", "))"' options.json

          # Fingerprint of the patch set. Results only stay valid while this is
          # unchanged, so it is part of the result cache key. The patcher is
          # deliberately excluded: a new patcher can change how a patch behaves.
          echo "bundles=$(cat toolchain/patches-*.mpp | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore cached originals and patch results
        uses: actions/cache/restore@v4
        with:
          path: |
            work/apks
            work/result-*.json
          # Rolling key, same pattern the release workflows use. The bundle hash keeps
          # results from a previous patch release out of this run, and the restore-keys
          # fallback picks up the newest cache that does match.
          key: protonvpn-probe-${{ steps.bundles.outputs.bundles }}-${{ github.run_id }}
          restore-keys: |
            protonvpn-probe-${{ steps.bundles.outputs.bundles }}-
            protonvpn-probe-

      - name: Walk releases newest first until every patch applies
        env:
          REUSE_RESULTS: '1'
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          cp ../toolchain/patches-*.mpp ../toolchain/morphe-desktop.jar \
             ../options.json ../src/keystore/morphe.keystore .
          python3 -u "$GITHUB_WORKSPACE/scripts/protonvpn-probe/walk.py"

      - name: Save cached originals and patch results
        uses: actions/cache/save@v4
        with:
          path: |
            work/apks
            work/result-*.json
          key: protonvpn-probe-${{ steps.bundles.outputs.bundles }}-${{ github.run_id }}

      - name: Render the matrix
        run: |
          set -euo pipefail
          cd work
          python3 "$GITHUB_WORKSPACE/scripts/protonvpn-probe/table.py"

      - name: Show the matrix in the run summary
        run: |
          set -euo pipefail
          # The repo has issues disabled, so the summary is the only place the matrix
          # can be reviewed as rendered markdown without publishing anything.
          {
            echo "## Proton VPN patch matrix"
            echo
            cat work/probe-body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: protonvpn-probe
          path: |
            work/probe-result.json
            work/probe-body.md
            work/out-*.apk
          retention-days: 7
          if-no-files-found: warn
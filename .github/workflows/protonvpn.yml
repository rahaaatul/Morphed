name: Proton VPN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protonvpn.yml'
      - 'src/patches/Proton-VPN-*/**'
      - 'patch_version.json'
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_FULL: rahaaatul/Morphed
  APP_SLUG: protonvpn
  APP_TITLE: 'Proton VPN'
  RELEASE_TAG: proton-vpn
  PACKAGE: ch.protonvpn.android
  UPSTREAM: ProtonVPN/android-app
  DOOM_OWNER_REPO: rushiranpise/morphe-patches
  HOODLES_OWNER_REPO: hoo-dles/morphe-patches
  # Forced on from MorpheApp's shared set, which declares no Proton VPN bundle of its
  # own. Everything else is read out of the bundles at run time.
  EXTRA_PATCHES: |
    Change installer source
    Disable Play Store updates
  # These two live in every bundle's shared set and apply to any app, so a version
  # carrying nothing else is not worth shipping.
  GENERIC_PATCHES: |
    Change installer source
    Disable Play Store updates
  MAX_VERSIONS: '10'
  # The download cell links an icon rather than the file name. Served from the
  # repository so one copy serves every release.
  ICON_URL: https://raw.githubusercontent.com/rahaaatul/Morphed/main/.github/icons/download.png
  ICON_WIDTH: '16'

jobs:
  discover:
    name: Discover supported versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      channels: ${{ steps.versions.outputs.channels }}
      reused: ${{ steps.versions.outputs.reused }}
      versions: ${{ steps.versions.outputs.versions }}
      expected_patches: ${{ steps.versions.outputs.expected_patches }}
      nothing_to_build: ${{ steps.versions.outputs.nothing_to_build }}
      patches_ver: ${{ steps.meta.outputs.patches_ver }}
      desktop_ver: ${{ steps.meta.outputs.desktop_ver }}
      recommended: ${{ steps.versions.outputs.recommended }}
      stable_versions: ${{ steps.versions.outputs.stable_versions }}
      experimental_versions: ${{ steps.versions.outputs.experimental_versions }}
      tools: ${{ steps.meta.outputs.tools }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Fetch Morphe patches and patcher
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Newest release carrying a wanted asset, prereleases preferred.
          newest_asset() {
            local repo=$1 ext=$2
            gh api "repos/${repo}/releases?per_page=30" | jq -r --arg ext "$ext" '
              ([.[] | select(.draft == false)] | sort_by(.published_at) | reverse) as $all
              | ([$all[] | select(.prerelease == true)] + [$all[] | select(.prerelease == false)])
              | .[].assets[]? | select(.name | endswith($ext)) | .browser_download_url' | head -1
          }

          curl -fsSL -o patches.mpp "$(newest_asset MorpheApp/morphe-patches .mpp)"
          curl -fsSL -o patches-doom.mpp "$(newest_asset "$DOOM_OWNER_REPO" .mpp)"
          curl -fsSL -o patches-hoodles.mpp "$(newest_asset "$HOODLES_OWNER_REPO" .mpp)"
          curl -fsSL -o morphe-desktop.jar "$(newest_asset MorpheApp/morphe-desktop .jar)"
          for f in patches.mpp patches-doom.mpp patches-hoodles.mpp morphe-desktop.jar; do
            [[ -s "$f" ]] || { echo "::error::$f missing or empty"; exit 1; }
          done
          ls -la *.mpp morphe-desktop.jar

          # Recorded without the leading v, which is the form patch_version.json uses.
          patches_ver=$(gh api repos/MorpheApp/morphe-patches/releases \
            --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | reverse | .[0].tag_name')
          desktop_ver=$(gh api repos/MorpheApp/morphe-desktop/releases \
            --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | reverse | .[0].tag_name')
          {
            echo "patches_ver=${patches_ver#v}"
            echo "desktop_ver=${desktop_ver#v}"
          } >> "$GITHUB_OUTPUT"

          # The body credits each tool with the exact version it used. Names go in via
          # --arg because an apostrophe inside the jq program breaks the shell quoting.
          doom_ver=$(gh api "repos/${DOOM_OWNER_REPO}/releases" \
            --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | reverse | .[0].tag_name')
          hoo_ver=$(gh api "repos/${HOODLES_OWNER_REPO}/releases" \
            --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | reverse | .[0].tag_name')
          tools=$(jq -nc \
            --arg d "$desktop_ver" --arg m "$patches_ver" \
            --arg doom "$doom_ver" --arg h "$hoo_ver" \
            --arg label "Doom's Morphe Patches" \
            '[["Morphe Desktop","https://github.com/MorpheApp/morphe-desktop",$d],
              ["Morphe Patches","https://github.com/MorpheApp/morphe-patches",$m],
              [$label,"https://github.com/rushiranpise/morphe-patches/",$doom],
              ["hoodles Morphe Patches","https://github.com/hoo-dles/morphe-patches",$h]]')
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      - name: List supported versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apkmeta

          # Each source states the app version its patches were written against. Read
          # them rather than hardcoding, since they move with every patch release.
          recommended() {
            java -jar morphe-desktop.jar list-versions -f "$PACKAGE" \
              --patches="$1" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*([0-9]+(\.[0-9]+)+).*/\1/p' | head -1
          }
          doom_rec=$(recommended patches-doom.mpp)
          hoo_rec=$(recommended patches-hoodles.mpp)
          echo "Doom recommends: ${doom_rec:-unknown}"
          echo "hoo-dles recommends: ${hoo_rec:-unknown}"
          {
            jq -nc --arg d "$doom_rec" --arg h "$hoo_rec" \
                    --arg label "Doom's Morphe Patches" \
              '{($label): {url: "https://github.com/rushiranpise/morphe-patches/", value: $d},
                ("hoodles Morphe Patches"): {url: "https://github.com/hoo-dles/morphe-patches", value: $h}}' \
              > recommended.json
            echo "recommended=$(cat recommended.json)" >> "$GITHUB_OUTPUT"
          } >> "$GITHUB_OUTPUT"

          # Every patch the sources recommend for this app, discovered rather than
          # listed here: whatever each bundle ships enabled for this package, in the
          # order the bundle lists them, grouped by source, then the forced extras.
          enabled_in() {
            java -jar morphe-desktop.jar list-patches -f "$PACKAGE" --patches="$1" 2>/dev/null \
              | awk '/^Name: /{n=substr($0,7)} /^Enabled: /{if($2=="true") print n}'
          }
          expected=$( {
              enabled_in patches-doom.mpp
              enabled_in patches-hoodles.mpp
              printf '%s\n' "$EXTRA_PATCHES"
            } | sed '/^$/d' | awk '!seen[$0]++' | jq -R . | jq -sc . )
          echo "expected patches: $expected"
          echo "expected_patches=$expected" >> "$GITHUB_OUTPUT"

          # What the bundles declare for this app. Listing without -x yields only the
          # stable targets and -x adds the experimental ones, so experimental is the
          # difference. A version in neither is a canary as far as the patches are
          # concerned: nothing upstream claims it and --force carried it.
          declared() {
            local -a flag=()
            # An absent flag must not be passed as an empty argument: list-versions
            # rejects "" as unmatched and exits non-zero, which pipefail promotes into
            # a step failure.
            if [[ -n "${1:-}" ]]; then flag=("$1"); fi
            local f
            for f in patches.mpp patches-doom.mpp patches-hoodles.mpp; do
              java -jar morphe-desktop.jar list-versions "${flag[@]}" \
                -f "$PACKAGE" --patches="$f" 2>/dev/null \
                | sed -nE 's/^[[:space:]]*([0-9]+(\.[0-9]+)+).*/\1/p'
            done | sort -u
          }
          stable_raw=$(declared '')
          stable=$(printf '%s\n' "$stable_raw" | sed '/^$/d' | jq -R . | jq -sc .)
          experimental_raw=$(declared '-x' \
            | grep -vxF -f <(printf '%s\n' "$stable_raw") || true)
          experimental=$(printf '%s\n' "$experimental_raw" | sed '/^$/d' | jq -R . | jq -sc .)
          echo "declared stable:       $stable"
          echo "declared experimental: $experimental"
          {
            echo "stable_versions=$stable"
            echo "experimental_versions=$experimental"
          } >> "$GITHUB_OUTPUT"

          # Proton publishes one universal APK per release, so there is no
          # architecture to filter on. Versions come straight off the releases feed,
          # newest first.
          versions=$(gh api "repos/${UPSTREAM}/releases?per_page=40" \
                     | jq -r '.[] | select(.draft == false) | .tag_name')

          # Walk back far enough to be certain the range contains a version every patch
          # applies to: past the older of the two versions the sources state.
          deepest=""
          for want in "$doom_rec" "$hoo_rec"; do
            [[ -n "$want" ]] || continue
            idx=$(printf '%s\n' "$versions" | grep -n "^${want}$" | head -1 | cut -d: -f1)
            [[ -n "$idx" ]] || { echo "::warning::$want is not a published release tag"; continue; }
            if [[ -z "$deepest" ]] || [[ "$idx" -gt "$deepest" ]]; then deepest="$idx"; fi
          done
          [[ -n "$deepest" ]] || deepest=3
          want_n=$(( deepest + 2 ))
          # Written as an if rather than [[ ... ]] && x=y, because a false test makes
          # the whole && list non-zero and set -e would abort the step.
          if [[ "$want_n" -gt "$MAX_VERSIONS" ]]; then want_n=$MAX_VERSIONS; fi
          versions=$(printf '%s\n' "$versions" | head -"$want_n")
          echo "covering $(printf '%s\n' "$versions" | grep -c .) release(s)"

          # A version already on the release was built from this same patch set, so it
          # needs no rebuild. Its APK is fetched back at publish time.
          done_versions=$(jq -r --arg o MorpheApp --arg r morphe-patches \
                              --arg t "$PATCHES_VER" --arg app "$APP_SLUG" \
                              '(.source[$o][$r][$t][$app].versions // [])[]' patch_version.json \
                              2>/dev/null || true)

          matrix='{"include":['
          channels='{'
          reused='['
          first_matrix=1; first_channel=1; first_reuse=1
          while read -r v; do
            [[ -n "$v" ]] || continue
            # Nothing upstream declares a Proton VPN version stable, so every build is
            # a canary by the patches' reckoning. Recorded per version so a future
            # bundle that does declare one is picked up without a code change.
            [[ $first_channel -eq 1 ]] || channels+=','
            channels+="\"$v\":\"Canary\""
            first_channel=0
            if printf '%s\n' "$done_versions" | grep -qxF "$v"; then
              [[ $first_reuse -eq 1 ]] || reused+=','
              reused+="\"$v\""; first_reuse=0
            else
              [[ $first_matrix -eq 1 ]] || matrix+=','
              matrix+="{\"version\":\"$v\",\"channel\":\"Canary\"}"
              first_matrix=0
            fi
          done <<< "$versions"

          # An empty matrix produces zero jobs, which GitHub reports as a failed run
          # even though every real job passed. Emit a single sentinel entry instead and
          # let the patch job skip its work, so a no-op run stays green.
          if [[ $first_matrix -eq 1 ]]; then
            matrix+='{"noop":true}'
            nothing_to_build=1
          fi
          matrix+=']}'
          channels+='}'
          reused+=']'
          {
            echo "matrix=$matrix"
            echo "channels=$channels"
            echo "reused=$reused"
            echo "nothing_to_build=${nothing_to_build:-0}"
          } >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix"

      - name: Generate options file
        if: steps.versions.outputs.nothing_to_build != '1'
        run: |
          set -euo pipefail
          # Three bundles are required. The generic install-source and update patches
          # live in MorpheApp's, the premium unlock in Doom's and the DNS, LAN,
          # split-tunneling and delay unlocks in hoo-dles's. No single repo has all of
          # them, so one bundle alone cannot satisfy the request.
          java -jar morphe-desktop.jar options-create \
            -f "$PACKAGE" -o options.json \
            -p patches.mpp -p patches-doom.mpp -p patches-hoodles.mpp

          # With more than one bundle loaded the -e flags are ignored and the options
          # file wins, so the selection has to be made here. Enabled by name across
          # every bundle so it does not matter which bundle each patch landed in.
          want=$(printf '%s' "${{ steps.versions.outputs.expected_patches }}" | jq -Rsc '
            (if startswith("[") then (fromjson? // []) else [splits("\n")] end)
            | map(select(length > 0))')
          jq --argjson want "$want" '
            [.[] | .patches |= with_entries(
               if (.key as $k | $want | index($k)) then .value.enabled = true else . end)]
          ' options.json > options.tmp && mv options.tmp options.json

          echo "patch state:"
          jq -r '.[0].patches | to_entries[] | select(.value.enabled == true) | .key' options.json | sort | wc -l

      - name: Upload patcher artifacts
        if: steps.versions.outputs.nothing_to_build != '1'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: morphe-toolchain
          path: |
            patches.mpp
            patches-doom.mpp
            patches-hoodles.mpp
            morphe-desktop.jar
            options.json
            apkmeta
          retention-days: 1
          if-no-files-found: error

  patch:
    name: Patch ${{ matrix.version }}
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Restore APK cache
        if: ${{ !matrix.noop }}
        uses: actions/cache/restore@v6
        with:
          path: apk-cache
          key: apk-cache-${{ env.APP_SLUG }}-${{ github.run_id }}
          restore-keys: |
            apk-cache-${{ env.APP_SLUG }}-

      - name: Download patcher artifacts
        if: ${{ !matrix.noop }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: morphe-toolchain
          path: .

      - name: Download APK from GitHub releases
        if: ${{ !matrix.noop }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apk-cache
          if [[ -s "apk-cache/protonvpn-${{ matrix.version }}.apk" ]]; then
            echo "reusing cached original for ${{ matrix.version }}"
            exit 0
          fi
          read -r url size < <(gh api \
            "repos/${UPSTREAM}/releases/tags/${{ matrix.version }}" \
            | jq -r '[.assets[] | select(.name | contains("vanilla-direct"))][0]
                     | "\(.browser_download_url) \(.size)"')
          [[ "$url" == "http"* && "$size" =~ ^[0-9]+$ ]] \
            || { echo "::error::could not resolve the direct-release APK"; exit 1; }
          curl -fsSL -o "apk-cache/protonvpn-${{ matrix.version }}.apk" "$url"
          got=$(stat -c%s "apk-cache/protonvpn-${{ matrix.version }}.apk")
          # A truncated download makes the patcher emit an empty result, which looks
          # identical to "this version is not supported" and drops it silently.
          if [[ "$got" != "$size" ]]; then
            echo "::error::truncated download: got $got, expected $size"
            exit 1
          fi
          ls -la apk-cache

      - name: Save APK cache
        if: ${{ !matrix.noop }}
        uses: actions/cache/save@v6
        with:
          path: apk-cache
          key: apk-cache-${{ env.APP_SLUG }}-${{ github.run_id }}

      - name: Patch APK
        if: ${{ !matrix.noop }}
        run: |
          set -euo pipefail
          # No --striplibs: Proton publishes a single universal APK carrying every ABI
          # it supports, so there is no per-architecture variant to pick and stripping
          # would needlessly break other devices.
          #
          # --force skips the APK version compatibility check, so a patch is attempted
          # on a release the bundle does not declare. Without it a patch that would
          # work is filtered out silently instead of being applied.
          #
          # --continue-on-error keeps a partial result usable: a patch that cannot match
          # its fingerprint is recorded as failed rather than aborting the build.
          #
          # Output is not captured, so the patcher's own Applied and FAILED lines stay
          # in this leg's log where they can be checked against the published body.
          java -jar morphe-desktop.jar patch \
            --patches=patches.mpp \
            --patches=patches-doom.mpp \
            --patches=patches-hoodles.mpp \
            --options-file=options.json \
            --out="proton-vpn-v${{ matrix.version }}.apk" \
            -r="result-${{ matrix.version }}.json" \
            --keystore=src/keystore/morphe.keystore \
            --force --continue-on-error \
            "apk-cache/protonvpn-${{ matrix.version }}.apk"

          # The arch label is read back out of the APK rather than asserted, so the body
          # cannot claim an architecture the shipped file does not have.
          abis=$(unzip -l "proton-vpn-v${{ matrix.version }}.apk" \
                 | grep -oE 'lib/[^/]+/' | sort -u | sed 's:^lib/::; s:/$::' || true)
          n=$(printf '%s\n' "$abis" | grep -c . || true)
          if [[ "$n" -gt 1 ]]; then arch="Universal"; else arch="${abis:-unknown}"; fi
          jq -nc --arg v "${{ matrix.version }}" --arg a "$arch" \
                 --argjson s "$(stat -c%s "proton-vpn-v${{ matrix.version }}.apk")" \
                 '{version: $v, arch: $a, size_bytes: $s}' \
            > "meta-${{ matrix.version }}.json"
          cat "meta-${{ matrix.version }}.json"

          # The per-version patch lists the release body is built from. The failed name
          # sits under a nested patch field; the top level is null.
          jq -r '.appliedPatches[]?.name // empty' "result-${{ matrix.version }}.json" \
            > "applied-${{ matrix.version }}.txt"
          jq -r '.failedPatches[]?.patch.name // empty' "result-${{ matrix.version }}.json" \
            > "failed-${{ matrix.version }}.txt"
          echo "applied $(grep -c . "applied-${{ matrix.version }}.txt" || true), failed $(grep -c . "failed-${{ matrix.version }}.txt" || true)"

      - name: Upload patched APK
        if: ${{ !matrix.noop }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apk-${{ matrix.version }}
          path: proton-vpn-v${{ matrix.version }}.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload applied patch list
        if: ${{ !matrix.noop }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: applied-${{ matrix.version }}
          path: ./applied-${{ matrix.version }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Upload failed patch list
        if: ${{ !matrix.noop }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: failed-${{ matrix.version }}
          path: ./failed-${{ matrix.version }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Upload patch metadata
        if: ${{ !matrix.noop }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: meta-${{ matrix.version }}
          path: ./meta-${{ matrix.version }}.json
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish release
    needs: [discover, patch]
    env:
      PATCHES_VER: ${{ needs.discover.outputs.patches_ver }}
    # Nothing was patched, so the release already holds the right APKs and body.
    # Running would re-download every APK just to write an identical body back.
    if: always() && needs.discover.outputs.nothing_to_build != '1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download patched APKs
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: apk-*
          path: release
          merge-multiple: true

      - name: Download applied patch lists
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: applied-*
          path: applied
          merge-multiple: true

      - name: Download failed patch lists
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: failed-*
          path: failed
          merge-multiple: true

      - name: Download patch metadata
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: meta-*
          path: meta
          merge-multiple: true

      - name: Verify and generate release body
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED: ${{ needs.discover.outputs.reused }}
          EXPECTED_PATCHES: ${{ needs.discover.outputs.expected_patches }}
          GENERIC_PATCHES: ${{ env.GENERIC_PATCHES }}
          RECOMMENDED: ${{ needs.discover.outputs.recommended }}
          STABLE_VERSIONS: ${{ needs.discover.outputs.stable_versions }}
          EXPERIMENTAL_VERSIONS: ${{ needs.discover.outputs.experimental_versions }}
          TOOLS: ${{ needs.discover.outputs.tools }}
          PATCHES_VER: ${{ needs.discover.outputs.patches_ver }}
          DESKTOP_VER: ${{ needs.discover.outputs.desktop_ver }}
          STATE_FILE: patch_version.json
        run: |
          set -euo pipefail
          mkdir -p ship

          # sort -Vr so the newest version leads the table, ordering version components
          # numerically rather than lexically. An empty glob yields an empty array, so
          # the guard below still fires.
          mapfile -t apks < <(find release -maxdepth 1 -name '*.apk' | sort -Vr)

          # Versions this run did not rebuild are already on the release. The publish
          # step clears existing assets, so fetch them again or they would vanish.
          reused=$(jq -r '.[]' <<< "$REUSED" | grep -c . || true)
          if [[ "$reused" -gt 0 ]]; then
            echo "Reusing $reused already-published APK(s)"
            while read -r v; do
              [[ -n "$v" ]] || continue
              name="proton-vpn-v${v}.apk"
              if gh release download "$RELEASE_TAG" --repo "$REPO_FULL" \
                   --pattern "$name" --dir release --clobber 2>/dev/null; then
                echo "  reused $name"
              else
                echo "::warning::Could not reuse $name, it will be dropped from the release"
              fi
            done < <(jq -r '.[]' <<< "$REUSED")
            mapfile -t apks < <(find release -maxdepth 1 -name '*.apk' | sort -Vr)
          fi

          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "::error::No APKs were produced by any patch job"
            exit 1
          fi

          # One record per shipped version, from the per-leg lists and metadata.
          for apk in "${apks[@]}"; do
            base=$(basename "$apk")
            v="${base#proton-vpn-v}"; v="${v%.apk}"
            [[ "$v" != "$base" ]] || continue
            size=$(( $(stat -c%s "$apk") / 1048576 ))
            arch=$(jq -r '.arch // "unknown"' "meta/meta-$v.json" 2>/dev/null || echo unknown)
            applied=$(tr '\n' ',' < "applied/applied-$v.txt" 2>/dev/null | sed 's/,$//' || true)
            failed=$(tr '\n' ',' < "failed/failed-$v.txt" 2>/dev/null | sed 's/,$//' || true)
            jq -nc --arg v "$v" --argjson s "$size" --arg a "$arch" \
                   --arg ap "$applied" --arg fa "$failed" \
                   '{version: $v, size: $s, arch: $a,
                     applied: ($ap | split(",") | map(select(length > 0))),
                     failed:  ($fa | split(",") | map(select(length > 0)))}' >> ship/all.jsonl
          done
          cat ship/all.jsonl

          # A version carrying nothing but the shared install-source and update patches
          # is a re-signed APK with the store relabelled and the updater disabled, which
          # is not worth a download. Ship from the newest release down to the newest
          # version every patch applied to; anything older is superseded.
          generic=$(printf '%s\n' "$GENERIC_PATCHES" | sed '/^$/d' | jq -R . | jq -sc .)
          expected=$(printf '%s' "$EXPECTED_PATCHES" | jq -Rsc \
            '(if startswith("[") then (fromjson? // []) else [splits("\n")] end) | map(select(length > 0))')

          # Flag each version, then take from the newest until the first complete one.
          # all.jsonl is already newest first, so the first complete record is the
          # anchor and everything after it is superseded.
          jq -s '.' ship/all.jsonl | jq --argjson e "$expected" --argjson g "$generic" '
            map(. as $r | {
              version: $r.version, size: $r.size, arch: $r.arch,
              applied: $r.applied, failed: $r.failed,
              bust: (($r.applied | length) > 0
                     and ([$r.applied[] | select(. as $p | $g | index($p))] | length)
                         == ($r.applied | length)),
              complete: (([$e[] as $p | select($r.applied | index($p))] | length) == ($e | length))
            })' > ship/flags.json

          anchor=$(jq -r '[.[] | select(.complete and (.bust | not))][0].version // ""' ship/flags.json)
          echo "anchor: ${anchor:-none}"

          jq 'reduce .[] as $r ({out: [], done: false};
                if .done then .
                elif $r.bust then .
                else .out += [$r] | if $r.complete then .done = true else . end
                end) | .out' ship/flags.json > ship/keep.json

          mapfile -t keep < <(jq -r '.[].version' ship/keep.json)
          echo "shipping ${#keep[@]} version(s): ${keep[*]}"
          if [[ ${#keep[@]} -eq 0 ]]; then
            echo "::error::every candidate was worth nothing"
            exit 1
          fi

          # The Patches table: every expected patch against the versions that support
          # it. `All` where it held everywhere, an except list where it did not, and the
          # full version list once the exceptions outgrow the compact form.
          versions=$(jq -r '[.[].version] | @tsv' -r ship/keep.json | tr '\t' ' ')
          {
            echo "| Patch | Applied on |"
            echo "| --- | --- |"
            while IFS= read -r p; do
              on=$(jq -r --arg p "$p" --arg vs "$versions" '
                    ($vs | split(" ")) as $all
                  | [ .[] | select(.applied | index($p)) | .version ] as $has
                  | if ($has | length) == ($all | length) then "`All`"
                    elif ($all | length) - ($has | length) <= 3 then
                      "`All` except " + ([ $all[] | select(. as $x | ($has | index($x)) == null) | "`\(.)`" ] | join(", "))
                    else ($has | map("`\(.)`") | join("<br>")) end' ship/keep.json)
              echo "| $p | $on |"
            done < <(printf '%s' "$expected" | jq -r '.[]')
          } > ship/patches.md

          channel_of() {
            local v=$1
            if jq -e --arg v "$v" 'index($v)' <<< "$STABLE_VERSIONS" >/dev/null; then echo Stable
            elif jq -e --arg v "$v" 'index($v)' <<< "$EXPERIMENTAL_VERSIONS" >/dev/null; then echo Beta
            else echo Canary; fi
          }

          {
            echo "> [!TIP]"
            if [[ -n "$anchor" ]]; then
              echo "> Install \`$anchor\`. It is the newest version where every patch applied cleanly."
            else
              echo "> [!WARNING]"
              echo "> No shipped version had every patch applied."
            fi
            echo
            echo "> [!NOTE]"
            # Each line needs the blockquote marker or it escapes the callout and
            # renders as a top level bullet.
            jq -r 'to_entries[] | "> - **[\(.key)](\(.value.url))** recommends `\(.value.value)`."' \
              <<< "$RECOMMENDED"
            echo
            echo "## Patches"
            echo
            cat ship/patches.md
            echo
            echo "## Downloads"
            echo
            echo "| Version | Channel | Arch | Size | Download |"
            echo "| :-------: | :-------: | :---------: | :-----: | :------------------------: |"
            jq -r '.[] | . as $r
              | (if (index($r.version) | not) then empty else empty end)' ship/keep.json >/dev/null
            while read -r v; do
              row=$(jq -c --arg v "$v" '.[] | select(.version == $v)' ship/keep.json)
              size=$(jq -r '.size' <<< "$row")
              arch=$(jq -r '.arch' <<< "$row")
              name="proton-vpn-v${v}.apk"
              url="https://github.com/${REPO_FULL}/releases/download/${RELEASE_TAG}/${name}"
              echo "| \`$v\` | $(channel_of "$v") | $arch | ${size}.0MB | <a href=\"$url\"><img src=\"$ICON_URL\" width=\"$ICON_WIDTH\" alt=\"Download $v\"></a> |"
            done <<< "$(jq -r '.[].version' ship/keep.json)"
            echo
            echo "## Tools used"
            echo
            echo "| Tool | Version |"
            echo "| --- | --- |"
            printf '%s\n' "$TOOLS" | jq -r '.[] | . as $t
              | "| [\($t[0])](\($t[1])) | [`\($t[2])`](\($t[1] | rtrimstr("/"))/releases/tag/\($t[2])) |"' 
          } > release-notes.md

          cat release-notes.md
          jq -r '[.[].version] | @csv' ship/keep.json | tr -d '"' | tr ',' '\n' | sed '/^$/d' | jq -Rsc 'split("\n") | map(select(length > 0))' > ship/versions.json
          cat ship/versions.json

      - name: Publish
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ env.APP_TITLE }}
          bodyFile: release-notes.md
          artifacts: |
            release/*.apk
          allowUpdates: true
          removeArtifacts: true
          prerelease: false
          makeLatest: false

      - name: Record patch state
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            applied=$(jq -s -r '[.[].applied[]] | unique | .[]' ship/keep.json)
            failed=$(jq -s -r '[.[].failed[]] | unique | .[]' ship/keep.json)
            versions=$(jq -r '.[].version' ship/keep.json)

            applied_json=$(printf '%s\n' "$applied" | jq -Rsc 'split("\n") | map(select(length > 0))')
            failed_json=$(printf '%s\n' "$failed" | jq -Rsc 'split("\n") | map(select(length > 0))')
            versions_json=$(printf '%s\n' "$versions" | jq -Rsc 'split("\n") | map(select(length > 0))')

            # The file is committed, but treat a missing one as empty so a fresh clone
            # or a manual delete cannot fail the release after it published.
            [[ -f "$STATE_FILE" ]] || echo '{}' > "$STATE_FILE"
            jq --arg org ProtonVPN --arg repo android-app --arg pkg "$PACKAGE" \
               --arg desktop "$DESKTOP_VER" --arg app "$APP_SLUG" \
               --argjson applied "$applied_json" \
               --argjson failed "$failed_json" \
               --argjson versions "$versions_json" \
               '.source[$org][$repo][$PATCHES_VER][$app] = {
                  org: $org, repo: $repo, package: $pkg,
                  desktop: $desktop,
                  patches_applied: $applied,
                  patches_failed: $failed,
                  versions: $versions
                }' "$STATE_FILE" > "$STATE_FILE.tmp"
            mv "$STATE_FILE.tmp" "$STATE_FILE"

            if git diff --cached --quiet; then
              echo "patch state already current"
              exit 0
            fi
            if git add "$STATE_FILE" \
               && git commit -S -m "Record $APP_TITLE build from $PATCHES_VER" \
               && git push; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::could not record patch state"

      - name: Clean up run artifacts
        if: always()
        run: |
          set -uo pipefail
          # The APKs now live on the release, so the run artifacts are redundant and can
          # be several hundred megabytes. Retention is only a backstop.
          ids=$(gh api "repos/${REPO_FULL}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                --paginate --jq '.artifacts[].id')
          if [[ -z "$ids" ]]; then
            echo "No artifacts to remove"
            exit 0
          fi
          for id in $ids; do
            gh api -X DELETE "repos/${REPO_FULL}/actions/artifacts/${id}" >/dev/null \
              || echo "::warning::Could not delete artifact ${id}"
          done